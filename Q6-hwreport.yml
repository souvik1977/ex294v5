---
- name: Q6 - Playbook to create hwreport
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: task-1 download template
      ansible.builtin.get_url:
        url: http://10.10.1.200/materials/emptyhw.report
        dest: /root/hwreport.txt
        mode: '0644'
    - name: task-2 generate report
      ansible.builtin.replace:
        path: /root/hwreport.txt
        regexp: "{{ item.key }}"
        replace: "{{ item.value }}"
      loop:
        - key: inventory hostname
          value: "{{ ansible_facts['hostname'] }}"
        - key: memory in MB
          value: "{{ ansible_facts['memtotal_mb'] }}"
        - key: BIOS_version
          value: "{{ ansible_facts['bios_version'] }}"
        - key: disk_sda_size
          value: "{{ ansible_facts['devices']['vda']['size'] | default('NONE') }}"
        - key: disk_sdb_size
          value: "{{ ansible_facts['devices']['vdb']['size'] | default('NONE') }}"
