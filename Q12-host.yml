---
- name: Q12 - Playbook to create myhosts
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Creating /etc/myhosts
      ansible.builtin.template:
        src: host.j2
        dest: /etc/myhosts
        owner: root
        group: root
        mode: '0644'
      when: inventory_hostname in groups['dev']
