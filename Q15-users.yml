---
- name: Q15 - Playbook to manager users
  hosts: dev,test,prod
  gather_facts: true
  become: true
  vars_files:
    - locker.yml
    - user_list.yml
  tasks:
    - name: Creating groups if not exists
      ansible.builtin.group:
        name: "{{ item.groupname }}"
        gid: "{{ item.gid }}"
        state: present
      loop: "{{ mygroups }}"

    - name: Creating developer users
      ansible.builtin.user:
        name: "{{ item.username }}"
        uid: "{{ item.uid }}"
        state: present
        shell: /bin/bash
        password: "{{ PW_developer | password_hash('sha512') }}"
        groups: devops
        append: true
      when:
        - item.type == "developer"
        - inventory_hostname in groups['dev'] or inventory_hostname in groups['test']
      loop: "{{ myusers }}"


    - name: Creating manager users
      ansible.builtin.user:
        name: "{{ item.username }}"
        uid: "{{ item.uid }}"
        state: present
        shell: /bin/bash
        password: "{{ PW_manager | password_hash('sha512') }}"
        groups: opsmgr
        append: true
      when:
        - item.type == "manager"
        - inventory_hostname in groups['prod']
      loop: "{{ myusers }}"


